<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" width="720" height="380" role="img" aria-labelledby="opkh-preview-title opkh-preview-desc">
  <title id="opkh-preview-title">The Off-Peak Hours pill with its panel open</title>
  <desc id="opkh-preview-desc">A rendering of the pill reading "Off-peak, 50% off, starts in 6h 40m" with a green status dot, and above it the opened panel: title DeepSeek with the value Off-peak (50% off), the answer line "Peak begins in 6d 23h, at Thu 2026-10-08 01:00 UTC", and rows for Holiday, Peak hours, Time, Holiday calendar, and Provider.</desc>

  <defs>
    <style>
      .surface { fill: #ffffff; }
      .panel { fill: #ffffff; stroke: #e8e8ea; }
      .rule { stroke: #ebedf0; }
      .frame { stroke: #e8e8ea; }
      .label { fill: #8a8f98; }
      .value { fill: #3d4149; }
      .strong { fill: #111827; }
      .pill { fill: #f3f4f6; }
      .pill-strong { fill: #374151; }
      .pill-body { fill: #6b7280; }
      .sep { fill: #cbd0d8; }
      .ok { fill: #16a34a; }
      .text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
    </style>
  </defs>

  <!-- The surface behind the composer's dock, so the drawn panel reads the
       same on a light and a dark README. -->
  <rect class="surface" x="0.5" y="0.5" width="719" height="379" rx="12" />
  <rect class="frame" x="0.5" y="0.5" width="719" height="379" rx="12" fill="none" />

  <!-- Panel shadow, offset rather than filtered: an SVG filter is not rendered
       identically everywhere a README image is displayed. -->
  <rect x="152" y="40" width="420" height="228" rx="12" fill="#000000" opacity="0.05" />

  <!-- Panel -->
  <rect class="panel" x="150" y="36" width="420" height="228" rx="12" />

  <circle class="ok" cx="169" cy="61" r="3.5" />
  <text class="text strong" x="180" y="65" font-size="13" font-weight="500">DeepSeek</text>
  <text class="text strong" x="552" y="65" font-size="13" font-weight="500" text-anchor="end">Off-peak (50% off)</text>

  <line class="rule" x1="166" y1="78" x2="554" y2="78" stroke-width="1" />

  <text class="text strong" x="166" y="99" font-size="12">Peak begins in 6d 23h, at Thu 2026-10-08 01:00 UTC</text>

  <text class="text label" x="166" y="129" font-size="12">Holiday</text>
  <text class="text value" x="270" y="129" font-size="12">National Day - off-peak all day</text>

  <text class="text label" x="166" y="153" font-size="12">Peak hours</text>
  <text class="text value" x="270" y="153" font-size="12">01:00-04:00 and 06:00-10:00 UTC, Mon-Fri,</text>
  <text class="text value" x="270" y="171" font-size="12">excluding Chinese public holidays.</text>

  <text class="text label" x="166" y="195" font-size="12">Time</text>
  <text class="text value" x="270" y="195" font-size="12">Thu 02:00 UTC &#183; Thu 10:00 UTC+8</text>

  <text class="text label" x="166" y="219" font-size="12">Holiday calendar</text>
  <text class="text value" x="270" y="219" font-size="12">2025-2026</text>

  <text class="text label" x="166" y="243" font-size="12">Provider</text>
  <text class="text value" x="270" y="243" font-size="12">deepseek-official</text>

  <!-- The pill, in its expanded (hover/aria-expanded) state, which is what it
       looks like while the panel is open. -->
  <rect class="pill" x="222" y="322" width="276" height="28" rx="14" />
  <circle class="ok" cx="246" cy="336" r="3.5" />
  <text class="text" x="258" y="341" font-size="13">
    <tspan class="pill-strong">Off-peak</tspan>
    <tspan class="sep"> &#183; </tspan>
    <tspan class="pill-body">50% off</tspan>
    <tspan class="sep"> &#183; </tspan>
    <tspan class="pill-body">starts in 6h 40m</tspan>
  </text>
</svg>
