name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Manifest and tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The manifest check and the test run use only Node built-ins plus one
        # YAML parser, so the floor is the version `engines` promises.
        node: ['22', '24']
    steps:
      # Pinned by commit SHA rather than the mutable `v7` tag: a re-pointed
      # major tag would otherwise run different code in CI. Dependabot's
      # github-actions ecosystem keeps these current and updates the comment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dev dependencies
        run: npm ci

      # The manifest check is the discovery contract: it fails if the patch
      # file stops being a top-level YAML array, if a patch row names a package
      # other than this one, or if a file the manifest promises is missing from
      # `files`.
      - name: Check the manifest contract
        run: npm run check:manifest

      - name: Run the test suite
        run: npm test
